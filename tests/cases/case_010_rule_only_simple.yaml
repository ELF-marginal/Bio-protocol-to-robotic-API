case_id: "case_010_rule_only_simple"
input_protocol: "Open the fridge, take the sample tube, add 100 uL buffer, mix 5 times, cap it, and return it to the fridge."
expected_actions:
  - "fridge.open"
  - "robot.pick"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.mix"
  - "pipette.discard_tip"
  - "tube.cap"
  - "robot.place"
expected_parsed_steps:
  - action: "take"
    item: "sample_tube"
  - action: "add"
    source: "buffer"
    target: "sample_tube"
    parameters:
      volume_ul: 100
  - action: "mix"
    target: "sample_tube"
    parameters:
      times: 5
  - action: "return"
    item: "sample_tube"
    target: "fridge"
expected_workflow_sequence:
  - "fridge.open"
  - "robot.pick"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.mix"
  - "pipette.discard_tip"
  - "tube.cap"
  - "fridge.open"
  - "robot.place"
  - "fridge.close"
expected_parameters:
  - api: "robot.pick"
    args:
      item: "sample_tube"
      from_location: "fridge"
  - api: "pipette.transfer"
    args:
      source: "buffer"
      target: "sample_tube"
      volume_ul: 100
  - api: "pipette.mix"
    args:
      container: "sample_tube"
      volume_ul: 100
      times: 5
  - api: "robot.place"
    args:
      item: "sample_tube"
      to_location: "fridge"
expected_final_state:
  tubes:
    sample_tube:
      is_capped: true
      location: "fridge"
must_not_include: []
expected_success: true
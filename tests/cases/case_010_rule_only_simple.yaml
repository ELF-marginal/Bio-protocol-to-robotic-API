case_id: case_010_rule_only_simple
input_protocol: "Take sample tube from fridge. Add 100 uL buffer to sample tube. Mix 5 times."
expected_success: true
expected_llm_parser_invoked: false
expected_workflow_sequence:
  - fridge.open
  - fridge.take_out
  - fridge.close
  - tube.uncap
  - pipette.attach_tip
  - pipette.transfer
  - pipette.mix
expected_parameters:
  - api: pipette.transfer
    args: { volume_ul: 100, source: buffer, target: sample_tube }

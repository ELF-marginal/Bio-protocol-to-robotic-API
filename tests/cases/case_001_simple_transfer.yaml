case_id: "case_001_simple_transfer"
input_protocol: "Add 100 uL buffer to the sample tube."
expected_actions:
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.discard_tip"
  - "tube.cap"
expected_parsed_steps:
  - action: "add"
    source: "buffer"
    target: "sample_tube"
    parameters:
      volume_ul: 100
expected_workflow_sequence:
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.discard_tip"
  - "tube.cap"
expected_parameters:
  - api: "pipette.transfer"
    args:
      source: "buffer"
      target: "sample_tube"
      volume_ul: 100
expected_final_state:
  tubes:
    sample_tube:
      is_capped: true
  reagents:
    buffer:
      volume_ul: 9900
must_not_include:
  - "centrifuge.run"
expected_success: true

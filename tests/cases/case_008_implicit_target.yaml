case_id: case_008_implicit_target
input_protocol: "Take the tube from the fridge. Add 120 uL buffer. Mix 6x. Incubate for 15 minutes at 37C."
expected_success: true
expected_llm_parser_invoked: true
expected_workflow_sequence:
  - fridge.open
  - fridge.take_out
  - fridge.close
  - tube.uncap
  - pipette.attach_tip
  - pipette.transfer
  - pipette.mix
  - heater.set_temperature
  - heater.incubate
expected_parameters:
  - api: pipette.transfer
    args: { volume_ul: 120, source: buffer, target: sample_tube }
  - api: pipette.mix
    args: { container: sample_tube, times: 6 }
  - api: heater.incubate
    args: { duration_min: 15 }

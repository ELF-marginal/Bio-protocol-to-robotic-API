case_id: "case_008_implicit_target"
input_protocol: "Take the sample tube from the fridge. Add 120 uL buffer. Mix 6 times. Incubate at 37C for 15 minutes."
expected_actions:
  - "fridge.open"
  - "robot.pick"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.mix"
  - "pipette.discard_tip"
  - "tube.cap"
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
  - "robot.place"
expected_parsed_steps:
  - action: "take"
    item: "sample_tube"
  - action: "add"
    source: "buffer"
    target: "sample_tube"
    parameters:
      volume_ul: 120
  - action: "mix"
    target: "sample_tube"
    parameters:
      times: 6
  - action: "incubate"
    target: "sample_tube"
    parameters:
      temperature_c: 37
      duration_min: 15
expected_workflow_sequence:
  - "fridge.open"
  - "robot.pick"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.mix"
  - "pipette.discard_tip"
  - "tube.cap"
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
  - "fridge.open"
  - "robot.place"
  - "fridge.close"
expected_parameters:
  - api: "robot.pick"
    args:
      item: "sample_tube"
      from_location: "fridge"
  - api: "pipette.transfer"
    args:
      source: "buffer"
      target: "sample_tube"
      volume_ul: 120
  - api: "pipette.mix"
    args:
      container: "sample_tube"
      volume_ul: 120
      times: 6
  - api: "heater.set_temperature"
    args:
      temperature_c: 37
  - api: "timer.wait"
    args:
      minutes: 15
  - api: "robot.place"
    args:
      item: "sample_tube"
      to_location: "fridge"
must_not_include: []
expected_success: true
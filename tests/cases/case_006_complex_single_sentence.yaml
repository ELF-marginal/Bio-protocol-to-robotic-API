case_id: case_006_complex_single_sentence
input_protocol: "Take the sample tube from the fridge, then add 100 uL buffer and mix 5 times, then incubate at 37C for 10 minutes."
expected_success: true
expected_llm_parser_invoked: true
expected_workflow_sequence:
  - fridge.open
  - fridge.take_out
  - fridge.close
  - tube.uncap
  - pipette.attach_tip
  - pipette.transfer
  - pipette.mix
  - heater.set_temperature
  - heater.incubate
expected_parameters:
  - api: pipette.transfer
    args: { volume_ul: 100, source: buffer, target: sample_tube }
  - api: pipette.mix
    args: { container: sample_tube, times: 5 }
  - api: heater.set_temperature
    args: { temperature_c: 37 }
  - api: heater.incubate
    args: { duration_min: 10 }

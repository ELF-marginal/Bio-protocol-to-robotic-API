case_id: "case_002_incubation"
input_protocol: "Incubate at 37C for 10 minutes."
expected_actions:
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
expected_parsed_steps:
  - action: "incubate"
    target: "sample_tube"
    parameters:
      temperature_c: 37
      duration_min: 10
expected_workflow_sequence:
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
expected_parameters:
  - api: "heater.set_temperature"
    args:
      temperature_c: 37
  - api: "timer.wait"
    args:
      minutes: 10
expected_final_state:
  heater:
    items: []
  tubes:
    sample_tube:
      location: "bench"
must_not_include:
  - "pipette.transfer"
expected_success: true

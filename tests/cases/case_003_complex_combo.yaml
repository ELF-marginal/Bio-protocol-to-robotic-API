case_id: "case_003_complex_combo"
input_protocol: "Take the sample tube from the fridge. Add 100 uL lysis buffer to the sample tube. Mix 5 times. Incubate at 37C for 10 min."
expected_actions:
  - "fridge.open"
  - "robot.pick"
  - "robot.place"
  - "pipette.transfer"
  - "pipette.mix"
  - "heater.set_temperature"
  - "timer.wait"
expected_parsed_steps:
  - action: "take"
    item: "sample_tube"
  - action: "add"
    source: "lysis_buffer"
    target: "sample_tube"
    parameters:
      volume_ul: 100
  - action: "mix"
    target: "sample_tube"
    parameters:
      times: 5
  - action: "incubate"
    target: "sample_tube"
    parameters:
      temperature_c: 37
      duration_min: 10
expected_parameters:
  - api: "pipette.transfer"
    args:
      source: "lysis_buffer"
      target: "sample_tube"
      volume_ul: 100
must_not_include: []
expected_success: false

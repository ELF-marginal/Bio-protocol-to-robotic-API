case_id: case_011_rule_only_incubation
input_protocol: "Take sample tube from fridge. Add 50 uL lysis buffer to sample tube. Incubate at 37C for 10 minutes."
expected_success: true
expected_llm_parser_invoked: false
expected_workflow_sequence:
  - fridge.open
  - fridge.take_out
  - fridge.close
  - tube.uncap
  - pipette.attach_tip
  - pipette.transfer
  - heater.set_temperature
  - heater.incubate
expected_parameters:
  - api: pipette.transfer
    args: { volume_ul: 50, source: lysis_buffer, target: sample_tube }
  - api: heater.incubate
    args: { duration_min: 10 }

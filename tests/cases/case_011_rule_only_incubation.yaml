case_id: "case_011_rule_only_incubation"
input_protocol: "Take the sample tube from the fridge, place it on the bench, add 50 uL lysis buffer, cap it, incubate at 37C for 10 minutes, then put it back into the fridge."
expected_actions:
  - "fridge.open"
  - "robot.pick"
  - "robot.place"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.discard_tip"
  - "tube.cap"
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
expected_parsed_steps:
  - action: "take"
    item: "sample_tube"
  - action: "place"
    item: "sample_tube"
    target: "bench"
  - action: "add"
    source: "lysis_buffer"
    target: "sample_tube"
    parameters:
      volume_ul: 50
  - action: "incubate"
    target: "sample_tube"
    parameters:
      temperature_c: 37
      duration_min: 10
  - action: "return"
    item: "sample_tube"
    target: "fridge"
expected_workflow_sequence:
  - "fridge.open"
  - "robot.pick"
  - "robot.place"
  - "fridge.close"
  - "tube.uncap"
  - "pipette.attach_tip"
  - "pipette.transfer"
  - "pipette.discard_tip"
  - "tube.cap"
  - "heater.set_temperature"
  - "heater.place"
  - "timer.wait"
  - "heater.remove"
  - "robot.pick"
  - "robot.place"
expected_parameters:
  - api: "robot.pick"
    occurrence: 1
    args:
      item: "sample_tube"
      from_location: "fridge"
  - api: "robot.place"
    occurrence: 1
    args:
      item: "sample_tube"
      to_location: "bench"
  - api: "pipette.transfer"
    args:
      source: "lysis_buffer"
      target: "sample_tube"
      volume_ul: 50
  - api: "heater.set_temperature"
    args:
      temperature_c: 37
  - api: "timer.wait"
    args:
      minutes: 10
  - api: "robot.pick"
    occurrence: 2
    args:
      item: "sample_tube"
      from_location: "bench"
  - api: "robot.place"
    occurrence: 2
    args:
      item: "sample_tube"
      to_location: "fridge"
expected_final_state:
  tubes:
    sample_tube:
      is_capped: true
      location: "fridge"
must_not_include: []
expected_success: true
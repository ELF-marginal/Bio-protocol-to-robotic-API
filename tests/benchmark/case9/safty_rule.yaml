- rule_id: no_aspirate_from_closed_container
  version: "1.0"
  metadata:
    name: "Do not aspirate from a closed container"
    category: liquid_handling
    severity: error
    scope: pre_call
    trigger_api: aspirate_liquid
    description: "Liquid cannot be aspirated unless the source container is open."
  bindings:
    source:
      from: call.args.source
      type: container
      required: true
  conditions:
    all:
      - id: source_is_closed
        kind: predicate_exists
        predicate: container_closed
        args:
          container: "$source"
  effect_on_validation:
    on_true:
      issue_type: safety_violation
      blocking: true
      message: "Cannot aspirate liquid from a closed source container."


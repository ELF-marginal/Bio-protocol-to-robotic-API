  bindings:
    container:
      from: call.args.container
      type: container
      required: true
  conditions:
    all:
      - id: container_is_open
        kind: predicate_exists
        predicate: container_open
        args:
          container: "$container"
  effect_on_validation:
    on_true:
      issue_type: safety_violation
      blocking: true
      message: "Cannot shake an open container."

- rule_id: no_stand_open_container
  version: "1.0"
  metadata:
    name: "Do not stand an open container"
    category: physical_safety
    severity: warning
    scope: pre_call
    trigger_api: stand_at_room_temperature
    description: "A tube should be closed during room-temperature standing."
  bindings:
    container:
      from: call.args.container
      type: container
      required: true
  conditions:
    all:
      - id: container_is_open
        kind: predicate_exists
        predicate: container_open
        args:
          container: "$container"
  effect_on_validation:
    on_true:
      issue_type: safety_violation
      blocking: true
      message: "The container is open during room-temperature standing."

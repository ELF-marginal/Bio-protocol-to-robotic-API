case_id: bio_lab_protocol_009_hard_dual_arm_biuret
difficulty: Hard
domain: bio_lab_colorimetric_dual_arm_api
lab_state: lab_state.yaml
safety_rules: safty_rule.yaml

input_text: >
  A dual-arm robot is located at bench_center. The robot has a left hand and a
  right hand. Each hand can hold at most one object at a time. The sample_tube is
  placed in rack_slot_A1 on bench_center. The blank_tube is placed in
  rack_slot_A2 on bench_center. The sample_solution_tube is placed in
  reagent_slot_B1 on bench_left. The distilled_water_tube is placed in
  reagent_slot_B2 on bench_left. The sodium_hydroxide_tube is placed in
  reagent_slot_B3 on bench_left. The copper_sulfate_tube is placed in
  reagent_slot_B4 on bench_left. The pipette is placed in pipette_slot_P1 on
  bench_right. Four clean tips are placed in tip_slot_T1 to tip_slot_T4 on
  bench_right. The waste container is placed in waste_slot_W1 on waste_area.
  Label sample_tube as sample_label and blank_tube as blank_label. Open
  sample_tube, blank_tube, sample_solution_tube, distilled_water_tube,
  sodium_hydroxide_tube, and copper_sulfate_tube. Use a fresh tip to transfer
  2000 uL of sample solution into sample_tube. Use a fresh tip to transfer
  2000 uL of distilled water into blank_tube. Use fresh tips to add 2000 uL of
  sodium hydroxide solution into each labeled tube. Cap sample_tube and
  blank_tube. Mix each labeled tube gently for 5 seconds. Reopen sample_tube and
  blank_tube. Move the copper sulfate dropper bottle to bench_center. Add
  3 drops of copper sulfate solution into sample_tube and 3 drops into
  blank_tube. Return the copper sulfate dropper bottle to reagent_slot_B4.
  Cap both labeled tubes again. Mix both labeled tubes gently for 5 seconds.
  Let both tubes stand at room temperature for 2 minutes. Finally, close all
  reagent containers and leave the robot with both hands empty.

expected_api_sequence:


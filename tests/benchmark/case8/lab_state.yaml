    - predicate: pipette_free
      args:
        pipette: pipette1

    - predicate: tip_clean
      args:
        tip: tip1

    - predicate: tip_clean
      args:
        tip: tip2

    - predicate: tip_clean
      args:
        tip: tip3

    - predicate: tip_clean
      args:
        tip: tip4

    - predicate: container_clean
      args:
        container: sample_tube

    - predicate: container_clean
      args:
        container: blank_tube

    - predicate: container_used
      args:
        container: sample_solution_tube

    - predicate: container_used
      args:
        container: distilled_water_tube

    - predicate: container_used
      args:
        container: sodium_hydroxide_tube

    - predicate: container_used
      args:
        container: copper_sulfate_tube

    - predicate: container_closed
      args:
        container: sample_tube

    - predicate: container_closed
      args:
        container: blank_tube

    - predicate: container_closed
      args:
        container: sample_solution_tube

    - predicate: container_closed
      args:
        container: distilled_water_tube

    - predicate: container_closed
      args:
        container: sodium_hydroxide_tube

    - predicate: container_closed
      args:
        container: copper_sulfate_tube

    - predicate: container_at
      args:
        container: sample_tube
        location: bench

    - predicate: container_at
      args:
        container: blank_tube
        location: bench

    - predicate: container_at
      args:
        container: sample_solution_tube
        location: bench

    - predicate: container_at
      args:

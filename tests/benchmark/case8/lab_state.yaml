    - predicate: container_at
      args:
        container: copper_sulfate_tube
        location: bench

    - predicate: device_at
      args:
        device: water_bath1
        location: bench

    - predicate: contains
      args:
        container: sample_solution_tube
        liquid: sample_solution

    - predicate: contains
      args:
        container: distilled_water_tube
        liquid: distilled_water

    - predicate: contains
      args:
        container: sodium_hydroxide_tube
        liquid: sodium_hydroxide

    - predicate: contains
      args:
        container: copper_sulfate_tube
        liquid: copper_sulfate

    - predicate: water_bath_off
      args:

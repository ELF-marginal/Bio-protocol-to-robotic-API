lab_state_id: medium_colorimetric_state_008
domain: bio_lab_colorimetric_api

objects:

  pipettes:
    pipette1:
      type: pipette

  tips:
    tip1:
      type: tip
    tip2:
      type: tip
    tip3:
      type: tip
    tip4:
      type: tip

  containers:
    sample_tube:
      type: tube
    blank_tube:
      type: tube
    sample_solution_tube:
      type: tube
    distilled_water_tube:
      type: tube
    sodium_hydroxide_tube:
      type: tube
    copper_sulfate_tube:
      type: tube

  liquids:
    sample_solution:
      type: sample
    distilled_water:
      type: buffer
    sodium_hydroxide:
      type: reagent
    copper_sulfate:
      type: reagent

  devices:
    water_bath1:
      type: water_bath

  locations:
    bench:
      type: location

  labels:
    sample_label:
      type: label
    blank_label:
      type: label

init:


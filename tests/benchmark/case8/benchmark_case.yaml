case_id: bio_lab_protocol_008
difficulty: Medium
domain: bio_lab_colorimetric_api
lab_state: lab_state.yaml

input_text: >
  Label one clean test tube as sample_tube. Label another clean test tube as
  blank_tube. Open the sample solution tube, distilled water tube, sodium
  hydroxide tube, copper sulfate tube, sample_tube, and blank_tube. Use a fresh
  tip to transfer 2000 uL of sample solution into sample_tube. Use a fresh tip
  to transfer 2000 uL of distilled water into blank_tube. Use fresh tips to add
  2000 uL of sodium hydroxide solution into each labeled tube. Cap both labeled
  tubes. Mix sample_tube gently for 5 seconds. Mix blank_tube gently for 5
  seconds. Reopen both labeled tubes. Add 3 drops of copper sulfate solution
  into sample_tube. Add 3 drops of copper sulfate solution into blank_tube. Cap
  both labeled tubes again. Mix both labeled tubes gently for 5 seconds. Let both
  tubes stand at room temperature for 2 minutes.


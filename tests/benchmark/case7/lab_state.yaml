lab_state_id: medium_colorimetric_state_007
domain: bio_lab_colorimetric_api

objects:

  pipettes:
    pipette1:
      type: pipette

  tips:
    tip1:
      type: tip
    tip2:
      type: tip
    tip3:
      type: tip
    tip4:
      type: tip

  containers:
    sample_tube:
      type: tube
    control_tube:
      type: tube
    sample_solution_tube:
      type: tube
    distilled_water_tube:
      type: tube
    benedict_reagent_tube:
      type: tube

  liquids:
    sample_solution:
      type: sample
    distilled_water:
      type: buffer
    benedict_reagent:
      type: reagent

  devices:
    water_bath1:
      type: water_bath

  locations:
    bench:
      type: location

  labels:
    sample_label:
      type: label
    control_label:
      type: label

init:

  predicates:

    - predicate: pipette_free
      args:
        pipette: pipette1

    - predicate: tip_clean
      args:
        tip: tip1

    - predicate: tip_clean
      args:
        tip: tip2

    - predicate: tip_clean
      args:
        tip: tip3

    - predicate: tip_clean
      args:
        tip: tip4

    - predicate: container_clean
      args:
        container: sample_tube

    - predicate: container_clean
      args:
        container: control_tube

    - predicate: container_used
      args:
        container: sample_solution_tube

    - predicate: container_used
      args:
        container: distilled_water_tube

    - predicate: container_used
      args:
        container: benedict_reagent_tube

    - predicate: container_closed
      args:
        container: sample_tube

    - predicate: container_closed
      args:
        container: control_tube

    - predicate: container_closed
      args:
        container: sample_solution_tube

    - predicate: container_closed
      args:
        container: distilled_water_tube

    - predicate: container_closed
      args:
        container: benedict_reagent_tube

    - predicate: container_at
      args:
        container: sample_tube
        location: bench

    - predicate: container_at
      args:
        container: control_tube
        location: bench

    - predicate: container_at
      args:
        container: sample_solution_tube
        location: bench

    - predicate: container_at
      args:
        container: distilled_water_tube
        location: bench

    - predicate: container_at
      args:
        container: benedict_reagent_tube
        location: bench

    - predicate: device_at
      args:
        device: water_bath1
        location: bench

    - predicate: contains
      args:
        container: sample_solution_tube
        liquid: sample_solution

    - predicate: contains
      args:
        container: distilled_water_tube
        liquid: distilled_water

    - predicate: contains
      args:
        container: benedict_reagent_tube
        liquid: benedict_reagent

    - predicate: water_bath_off
      args:
        water_bath: water_bath1

  functions:

    - function: pipette_max_volume
      args:
        pipette: pipette1
      value: 5000
      unit: ul

    - function: capacity
      args:
        container: sample_tube
      value: 10000
      unit: ul

    - function: capacity
      args:
        container: control_tube
      value: 10000
      unit: ul

    - function: capacity
      args:
        container: sample_solution_tube
      value: 15000
      unit: ul

    - function: capacity
      args:
        container: distilled_water_tube
      value: 15000
      unit: ul

    - function: capacity
      args:
        container: benedict_reagent_tube
      value: 15000
      unit: ul

    - function: total_volume
      args:
        container: sample_tube
      value: 0
      unit: ul

    - function: total_volume
      args:
        container: control_tube
      value: 0
      unit: ul

    - function: total_volume
      args:
        container: sample_solution_tube
      value: 8000
      unit: ul

    - function: total_volume
      args:
        container: distilled_water_tube
      value: 8000
      unit: ul

    - function: total_volume
      args:
        container: benedict_reagent_tube
      value: 10000
      unit: ul

    - function: volume
      args:
        container: sample_tube
        liquid: sample_solution
      value: 0
      unit: ul

    - function: volume
      args:
        container: sample_tube
        liquid: benedict_reagent
      value: 0
      unit: ul

    - function: volume
      args:
        container: control_tube
        liquid: distilled_water
      value: 0
      unit: ul

    - function: volume
      args:
        container: control_tube
        liquid: benedict_reagent
      value: 0
      unit: ul

    - function: volume
      args:
        container: sample_solution_tube
        liquid: sample_solution
      value: 8000
      unit: ul

    - function: volume
      args:
        container: distilled_water_tube
        liquid: distilled_water
      value: 8000
      unit: ul

    - function: volume
      args:
        container: benedict_reagent_tube
        liquid: benedict_reagent
      value: 10000
      unit: ul

    - function: temperature
      args:
        device: water_bath1
      value: 25
      unit: celsius

    - function: mix_duration
      args:
        container: sample_tube
      value: 0
      unit: sec

    - function: mix_duration
      args:
        container: control_tube
      value: 0
      unit: sec

    - function: heat_temperature
      args:
        container: sample_tube
      value: 0
      unit: celsius

    - function: heat_temperature
      args:
        container: control_tube
      value: 0
      unit: celsius

    - function: heat_duration
      args:
        container: sample_tube
      value: 0
      unit: min

    - function: heat_duration
      args:
        container: control_tube
      value: 0
      unit: min

    - function: cooling_duration
      args:
        container: sample_tube
      value: 0
      unit: min

    - function: cooling_duration
      args:
        container: control_tube
      value: 0
      unit: min

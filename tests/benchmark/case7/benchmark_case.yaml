case_id: bio_lab_protocol_007
difficulty: Medium
domain: bio_lab_colorimetric_api
lab_state: lab_state.yaml

input_text: >
  Label one clean test tube as sample_tube. Label another clean test tube as
  control_tube. Open the sample solution tube, distilled water tube, Benedict
  reagent tube, sample_tube, and control_tube. Use a fresh tip to transfer 2000
  uL of sample solution into sample_tube. Use a fresh tip to transfer 2000 uL of
  distilled water into control_tube. Use fresh tips to add 2000 uL of Benedict
  reagent into each labeled tube. Cap both labeled tubes. Mix sample_tube gently
  for 5 seconds. Mix control_tube gently for 5 seconds. Set the water bath to 95
  C. Place both labeled tubes in the water bath. Heat both tubes at 95 C for 5
  minutes. Remove both tubes from the water bath. Cool both tubes at room
  temperature for 2 minutes.


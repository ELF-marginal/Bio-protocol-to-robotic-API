lab_state_id: simple_bio_lab_state_002
domain: bio_lab_numeric_api

objects:

  pipettes:
    pipette1:
      type: pipette

  tips:
    tip1:
      type: tip
    tip2:
      type: tip
    tip3:
      type: tip

  containers:
    dna_sample_tube:
      type: tube
    primer_mix_tube:
      type: tube
    pcr_tube:
      type: tube

  liquids:
    dna_sample:
      type: sample
    primer_mix:
      type: reagent

  devices:
    fridge1:
      type: fridge
    heater1:
      type: heater
    centrifuge1:
      type: centrifuge

  locations:
    bench:
      type: location
    cold_room:
      type: location

init:

  predicates:

    - predicate: pipette_free
      args:
        pipette: pipette1

    - predicate: tip_clean
      args:
        tip: tip1

    - predicate: tip_clean
      args:
        tip: tip2

    - predicate: tip_clean
      args:
        tip: tip3

    - predicate: container_closed
      args:
        container: dna_sample_tube

    - predicate: container_closed
      args:
        container: primer_mix_tube

    - predicate: container_closed
      args:
        container: pcr_tube

    - predicate: container_used
      args:
        container: dna_sample_tube

    - predicate: container_used
      args:
        container: primer_mix_tube

    - predicate: container_clean
      args:
        container: pcr_tube

    - predicate: container_at
      args:
        container: dna_sample_tube
        location: bench

    - predicate: container_at
      args:
        container: primer_mix_tube
        location: bench

    - predicate: container_at
      args:
        container: pcr_tube
        location: bench

    - predicate: contains
      args:
        container: dna_sample_tube
        liquid: dna_sample

    - predicate: contains
      args:
        container: primer_mix_tube
        liquid: primer_mix

    - predicate: liquid_at
      args:
        liquid: dna_sample
        location: bench

    - predicate: liquid_at
      args:
        liquid: primer_mix
        location: bench

    - predicate: device_at
      args:
        device: fridge1
        location: cold_room

    - predicate: device_at
      args:
        device: heater1
        location: bench

    - predicate: device_at
      args:
        device: centrifuge1
        location: bench

    - predicate: fridge_closed
      args:
        fridge: fridge1

    - predicate: heater_off
      args:
        heater: heater1

    - predicate: centrifuge_closed
      args:
        centrifuge: centrifuge1

  functions:

    - function: pipette_max_volume
      args:
        pipette: pipette1
      value: 1000
      unit: ul

    - function: capacity
      args:
        container: dna_sample_tube
      value: 1500
      unit: ul

    - function: capacity
      args:
        container: primer_mix_tube
      value: 1500
      unit: ul

    - function: capacity
      args:
        container: pcr_tube
      value: 1500
      unit: ul

    - function: total_volume
      args:
        container: dna_sample_tube
      value: 100
      unit: ul

    - function: total_volume
      args:
        container: primer_mix_tube
      value: 200
      unit: ul

    - function: total_volume
      args:
        container: pcr_tube
      value: 0
      unit: ul

    - function: volume
      args:
        container: dna_sample_tube
        liquid: dna_sample
      value: 100
      unit: ul

    - function: volume
      args:
        container: primer_mix_tube
        liquid: primer_mix
      value: 200
      unit: ul

    - function: volume
      args:
        container: pcr_tube
        liquid: dna_sample
      value: 0
      unit: ul

    - function: volume
      args:
        container: pcr_tube
        liquid: primer_mix
      value: 0
      unit: ul

    - function: temperature
      args:
        device: heater1
      value: 25
      unit: celsius

    - function: heater_min_temperature
      args:
        device: heater1
      value: 0
      unit: celsius

    - function: heater_max_temperature
      args:
        device: heater1
      value: 500
      unit: celsius

    - function: centrifuge_max_speed
      args:
        centrifuge: centrifuge1
      value: 20000
      unit: rpm

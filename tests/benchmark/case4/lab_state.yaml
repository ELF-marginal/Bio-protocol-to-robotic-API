lab_state_id: simple_bio_lab_state_004
domain: bio_lab_numeric_api

objects:

  pipettes:
    pipette1:
      type: pipette

  tips:
    tip1:
      type: tip

  containers:
    cell_lysate_tube:
      type: tube
    spin_tube:
      type: tube

  liquids:
    cell_lysate:
      type: sample

  devices:
    fridge1:
      type: fridge
    heater1:
      type: heater
    centrifuge1:
      type: centrifuge

  locations:
    bench:
      type: location
    cold_room:
      type: location

init:

  predicates:

    - predicate: pipette_free
      args:
        pipette: pipette1

    - predicate: tip_clean
      args:
        tip: tip1

    - predicate: container_closed
      args:
        container: cell_lysate_tube

    - predicate: container_closed
      args:
        container: spin_tube

    - predicate: container_used
      args:
        container: cell_lysate_tube

    - predicate: container_clean
      args:
        container: spin_tube

    - predicate: container_at
      args:
        container: cell_lysate_tube
        location: bench

    - predicate: container_at
      args:
        container: spin_tube
        location: bench

    - predicate: contains
      args:
        container: cell_lysate_tube
        liquid: cell_lysate

    - predicate: liquid_at
      args:
        liquid: cell_lysate
        location: bench

    - predicate: device_at
      args:
        device: fridge1
        location: cold_room

    - predicate: device_at
      args:
        device: heater1
        location: bench

    - predicate: device_at
      args:
        device: centrifuge1
        location: bench

    - predicate: fridge_closed
      args:
        fridge: fridge1

    - predicate: heater_off
      args:
        heater: heater1

    - predicate: centrifuge_closed
      args:
        centrifuge: centrifuge1

  functions:

    - function: pipette_max_volume
      args:
        pipette: pipette1
      value: 1000
      unit: ul

    - function: capacity
      args:
        container: cell_lysate_tube
      value: 1500
      unit: ul

    - function: capacity
      args:
        container: spin_tube
      value: 1500
      unit: ul

    - function: total_volume
      args:
        container: cell_lysate_tube
      value: 500
      unit: ul

    - function: total_volume
      args:
        container: spin_tube
      value: 0
      unit: ul

    - function: volume
      args:
        container: cell_lysate_tube
        liquid: cell_lysate
      value: 500
      unit: ul

    - function: volume
      args:
        container: spin_tube
        liquid: cell_lysate
      value: 0
      unit: ul

    - function: temperature
      args:
        device: heater1
      value: 25
      unit: celsius

    - function: heater_min_temperature
      args:
        device: heater1
      value: 0
      unit: celsius

    - function: heater_max_temperature
      args:
        device: heater1
      value: 100
      unit: celsius

    - function: centrifuge_speed
      args:
        container: spin_tube
      value: 0
      unit: rpm

    - function: centrifuge_duration
      args:
        container: spin_tube
      value: 0
      unit: min

    - function: centrifuge_max_speed
      args:
        centrifuge: centrifuge1
      value: 20000
      unit: rpm
